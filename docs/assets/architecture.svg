<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Arquitectura del CubeCell LoRaWAN Bridge v1.3</title>
  <desc id="archDesc">Diagrama de topologia: operador por serial, nodo Heltec CubeCell HTCC-AB01 con SX1262, gateway Milesight UG56 con Network Server embebido, broker MQTT y aplicacion.</desc>

  <defs>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8FA3BF"/>
    </marker>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233A"/>
      <stop offset="100%" stop-color="#0F1A2B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#0B1220"/>

  <text x="40" y="52" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#E6EDF7">CubeCell LoRaWAN Bridge v1.3</text>
  <text x="40" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8FA3BF">Serial &#8596; LoRaWAN &#183; AU915 sub-banda 2 &#183; OTAA Clase A &#183; RadioLib 7.7.1</text>

  <!-- Columna 1: Operador -->
  <g>
    <rect x="40" y="130" width="210" height="330" rx="12" fill="#111A2B" stroke="#24334D" stroke-width="1.5"/>
    <text x="60" y="162" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8FA3BF" letter-spacing="1.5">OPERADOR</text>
    <rect x="60" y="182" width="170" height="62" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="145" y="208" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF7">cutecom / picocom</text>
    <text x="145" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">115200 8N1</text>

    <rect x="60" y="262" width="170" height="62" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="145" y="288" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF7">ESP32 / MCU</text>
    <text x="145" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">UART TTL 3.3 V</text>

    <text x="145" y="356" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">HEX + Enter</text>
    <text x="145" y="376" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">comandos de vuelta</text>

    <rect x="60" y="402" width="170" height="38" rx="6" fill="#0E2A33" stroke="#155E63"/>
    <text x="145" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22D3EE">3.3 V &#183; GND comun</text>
  </g>

  <!-- Columna 2: Nodo CubeCell -->
  <g>
    <rect x="300" y="130" width="250" height="330" rx="12" fill="url(#boardGrad)" stroke="#22D3EE" stroke-width="1.8"/>
    <text x="320" y="162" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#22D3EE" letter-spacing="1.5">NODO LORAWAN</text>
    <text x="425" y="192" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E6EDF7">Heltec CubeCell</text>
    <text x="425" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8FA3BF">HTCC-AB01</text>

    <rect x="320" y="232" width="210" height="52" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="425" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22D3EE">ASR6502 &#183; Cortex-M0+</text>
    <text x="425" y="270" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">48 MHz &#183; 128 KB Flash &#183; 16 KB SRAM</text>

    <rect x="320" y="296" width="210" height="52" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="425" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#F59E0B">SX1262 (SPI interno)</text>
    <text x="425" y="334" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">NSS 35 &#183; DIO1 38 &#183; RST 47 &#183; BUSY 39</text>

    <rect x="320" y="364" width="210" height="72" rx="8" fill="#0E1B2E" stroke="#2C405F"/>
    <text x="332" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">&#8226; bridge HEX interactivo</text>
    <text x="332" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">&#8226; heartbeat BB / 30 s</text>
    <text x="332" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">&#8226; downlink a serial</text>
  </g>

  <!-- Columna 3: Gateway -->
  <g>
    <rect x="600" y="130" width="240" height="330" rx="12" fill="#111A2B" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="620" y="162" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1.5">GATEWAY</text>
    <text x="720" y="192" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E6EDF7">Milesight UG56</text>
    <text x="720" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">LoRaWAN 8 canales</text>

    <rect x="620" y="232" width="200" height="46" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="720" y="250" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E6EDF7">Network Server</text>
    <text x="720" y="267" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">embebido</text>

    <rect x="620" y="288" width="200" height="46" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="720" y="306" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E6EDF7">Interfaz web</text>
    <text x="720" y="323" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">devices / downlink</text>

    <rect x="620" y="344" width="200" height="46" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="720" y="362" text-anchor="middle" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E6EDF7">Broker MQTT</text>
    <text x="720" y="379" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">uplink / downlink</text>

    <text x="720" y="424" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748B">FSB 2 &#183; 916.8&#8211;918.2 MHz</text>
    <text x="720" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748B">RX2 923.3 MHz / SF12BW500</text>
  </g>

  <!-- Columna 4: Aplicacion -->
  <g>
    <rect x="880" y="130" width="280" height="330" rx="12" fill="#111A2B" stroke="#A78BFA" stroke-width="1.8"/>
    <text x="900" y="162" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#A78BFA" letter-spacing="1.5">APLICACION</text>

    <rect x="900" y="182" width="240" height="52" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="1020" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E6EDF7">backend / dashboard</text>
    <text x="1020" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">MQTT subscribe</text>

    <rect x="900" y="248" width="240" height="52" rx="8" fill="#16233A" stroke="#2C405F"/>
    <text x="1020" y="270" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E6EDF7">Node-RED / InfluxDB</text>
    <text x="1020" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">opcional</text>

    <rect x="900" y="314" width="240" height="86" rx="8" fill="#0E1B2E" stroke="#2C405F"/>
    <text x="912" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">La app NO habla con el nodo:</text>
    <text x="912" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">encola el downlink en el NS y</text>
    <text x="912" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BF">espera el proximo uplink</text>
    <text x="912" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22D3EE">(Clase A: 0&#8211;30 s de latencia)</text>
  </g>

  <!-- Enlaces -->
  <g>
    <!-- serial -->
    <line x1="250" y1="212" x2="300" y2="212" stroke="#22D3EE" stroke-width="2.4" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <text x="275" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#22D3EE">UART</text>

    <!-- LoRa uplink -->
    <line x1="550" y1="300" x2="600" y2="300" stroke="#F59E0B" stroke-width="2.6" marker-end="url(#arrowAmber)"/>
    <text x="575" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#F59E0B">LoRa</text>

    <!-- LoRa downlink -->
    <path d="M600 336 L550 336" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
    <text x="575" y="354" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#F59E0B">DL</text>

    <!-- MQTT -->
    <line x1="840" y1="256" x2="880" y2="208" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#arrowViolet)"/>
    <line x1="880" y1="276" x2="840" y2="360" stroke="#A78BFA" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowViolet)"/>
    <text x="872" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#A78BFA">MQTT</text>
  </g>

  <!-- Leyenda -->
  <g>
    <rect x="40" y="500" width="1120" height="120" rx="12" fill="#0E1626" stroke="#1D2B42"/>
    <text x="60" y="526" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8FA3BF" letter-spacing="1.2">LEYENDA</text>

    <line x1="60" y1="552" x2="100" y2="552" stroke="#22D3EE" stroke-width="2.4" marker-end="url(#arrowCyan)"/>
    <text x="110" y="556" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C7D4E6">Serial 115200 8N1 (USB o TTL)</text>

    <line x1="330" y1="552" x2="370" y2="552" stroke="#F59E0B" stroke-width="2.6" marker-end="url(#arrowAmber)"/>
    <text x="380" y="556" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C7D4E6">Uplink LoRaWAN (fPort 1)</text>

    <line x1="620" y1="552" x2="660" y2="552" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
    <text x="670" y="556" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C7D4E6">Downlink (solo tras uplink)</text>

    <line x1="890" y1="552" x2="930" y2="552" stroke="#A78BFA" stroke-width="2.4" marker-end="url(#arrowViolet)"/>
    <text x="940" y="556" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C7D4E6">MQTT / HTTP</text>

    <text x="60" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748B">El gateway y el nodo deben coincidir en region y sub-banda. Si el UG56 esta en FSB 1, el join nunca se completa.</text>
  </g>
</svg>
